name: Build (Linux, Windows & Web)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux (.deb & Portable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências de compilação Linux (GTK3)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar pacotes Dart/Flutter
        run: flutter pub get

      - name: Compilar aplicativo para Linux (Release)
        run: flutter build linux --release

      - name: Gerar instalador .deb e arquivo portátil .tar.gz
        run: |
          chmod +x installer/build_linux_deb.sh
          ./installer/build_linux_deb.sh

      - name: Publicar instaladores Linux como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaixadorImagens-Linux-Installers
          path: |
            dist/BaixadorImagens-Linux-x64.deb
            dist/BaixadorImagens-Linux-x64-Portable.tar.gz

  build-windows:
    name: Build Windows (Setup.exe & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar pacotes Dart/Flutter
        run: flutter pub get

      - name: Compilar aplicativo para Windows (Release)
        run: flutter build windows --release

      - name: Gerar instalador Windows (.exe) com Inno Setup
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\+\s]+)').Matches.Groups[1].Value
          Write-Host "Gerando instalador Windows para a versao: $version"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc "/DMyAppVersion=$version" installer/windows_setup.iss

      - name: Gerar versão portátil (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/BaixadorImagens-Windows-x64-Portable.zip" -Force

      - name: Publicar instaladores Windows como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaixadorImagens-Windows-Installers
          path: |
            dist/BaixadorImagens-Windows-Setup.exe
            dist/BaixadorImagens-Windows-x64-Portable.zip

  build-web:
    name: Build Web (Navegador)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar pacotes Dart/Flutter
        run: flutter pub get

      - name: Compilar aplicativo para Web (Release)
        run: flutter build web --release

      - name: Empacotar build Web (.zip)
        run: |
          mkdir -p dist
          cd build/web && zip -r ../../dist/BaixadorImagens-Web.zip .

      - name: Publicar build Web como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaixadorImagens-Web
          path: dist/BaixadorImagens-Web.zip

  release:
    name: Criar GitHub Release (em tags v*)
    needs: [build-linux, build-windows, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Artifacts gerados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar na aba Releases do GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true

